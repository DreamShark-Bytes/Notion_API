[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-api"
version = "1.2.2"
description = "Shared Notion API client and data extraction utilities"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[tool.setuptools]
py-modules = ["notion_api"]
